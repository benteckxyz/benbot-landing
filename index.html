<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benbot — Autonomous AI Workforce Platform</title>
  <meta name="description" content="Next-generation enterprise AI agents for omnichannel commerce, CRM, and automated operations." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-container">
    <div class="content-card">
      <!-- Logo & Brand -->
      <div class="brand">
        <img src="logo.svg" alt="Benbot Logo" class="brand-logo" />
        <h1 class="brand-name">BENBOT</h1>
      </div>

      <!-- Status Badge -->
      <div class="badge-preview">
        <span class="badge-dot"></span>
        Private Early Access
      </div>

      <!-- Main Headline -->
      <h2 class="title">Autonomous AI Workforce Platform</h2>

      <!-- Concise Description -->
      <p class="description">
        Next-generation enterprise AI agents for omnichannel commerce, CRM, and automated operations.
      </p>

      <!-- Direct Contact Box -->
      <div class="contact-box">
        <div class="email-display">
          <svg class="email-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span class="email-text">hello@benbot.co</span>
        </div>

        <div class="actions">
          <button class="btn btn-outline" onclick="copyEmail()" title="Copy email address">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          </button>
          <a href="mailto:hello@benbot.co?subject=Benbot%20Enterprise%20Inquiry" class="btn btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span>Contact Us</span>
          </a>
        </div>
      </div>

      <!-- Simple Footer Note -->
      <div class="footer-note">
        &copy; 2026 Benbot Inc. All rights reserved.
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31cb72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <span>Email copied to clipboard!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
